<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Denim HTML</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600&display=swap" />
  </head>
  <body class="loading">
    <div class="loader" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <span class="loader-rows loader-track"></span>
      <span class="loader-rows loader-fill"></span>
      <span class="loader-needle"></span>
    </div>
    <div class="dock">
      <ul class="prints" id="prints" role="menu" aria-label="Prints" hidden></ul>
      <button class="menu" type="button" aria-label="Prints" title="Prints" aria-haspopup="menu" aria-expanded="false" aria-controls="prints" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M12 3.6 21 8.2l-9 4.6-9-4.6z" />
          <path d="m3 12.4 9 4.6 9-4.6" />
          <path d="m3 16.4 9 4.6 9-4.6" />
        </svg>
      </button>
      <button class="reset" type="button" aria-label="Reset the denim" title="Reset the denim">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M19.4 13.1a7.5 7.5 0 1 1-2.1-6.4" />
          <path d="M18.3 3.4v3.9h-3.9" />
        </svg>
        <span>Reset</span>
      </button>
    </div>
    <div class="interactive" role="img" aria-label="The page has the mouse and keyboard (I to give them back)" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M6.5 3.8v14.6l3.9-3.8 2.7 6 2.5-1.1-2.7-5.9 5.4-.3z" />
      </svg>
    </div>
    <div class="status" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
