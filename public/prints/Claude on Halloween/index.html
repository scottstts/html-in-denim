<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Claude's Halloween</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Press+Start+2P&display=block" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#05030b;overflow:hidden}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

// ---------------------------------------------------------------- math
const TAU = Math.PI * 2;
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, t) => a + (b - a) * t;
const eio = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const eo = t => 1 - Math.pow(1 - t, 3);
const backO = t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const hop = (T, t0, d, h) => { const u = (T - t0) / d; return u > 0 && u < 1 ? 4 * u * (1 - u) * h : 0; };
const env = (T, a, b, f = .25) => Math.min(seg(T, a, a + f), 1 - seg(T, b - f, b));
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const n1 = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u); };
const flick = (t, ph) => 0.74 + 0.17 * n1(t * 7 + ph * 13) + 0.09 * n1(t * 19 + ph * 7);
const bez = (a, c, b, u) => (1 - u) * (1 - u) * a + 2 * (1 - u) * u * c + u * u * b;
const mixc = (c1, c2, t) => `rgb(${c1.map((v, i) => Math.round(lerp(v, c2[i], t))).join(',')})`;

// ---------------------------------------------------------------- stage
// Virtual stage is 1600 x 900; wider/taller screens reveal more scenery.
let DPR = 1, S = 1, OX = 0, OY = 0, Lx = 0, Rx = 1600, Ty = 0, By = 900;
function resize() {
  const w = innerWidth, h = innerHeight;
  if (!w || !h) return;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  const portrait = h > w;
  S = Math.min(h / 900, w / (portrait ? 780 : 1150));
  const VW = w / S, VH = h / S, cx = portrait ? 930 : 800;
  OX = VW / 2 - cx; OY = (VH - 900) * (portrait ? .5 : .62);
  Lx = -OX; Rx = VW - OX; Ty = -OY; By = 900 + (VH - 900 - OY);
}
addEventListener('resize', resize); resize();
const base = () => ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * S * OX, DPR * S * OY);

const LOOP = 30, MX = 1235, MY = 215, MR = 98, U = 13;
const CSTOP = 715, PX = 905, PR = 70, TOMB_X = 1190, GX = 866, GY = 500;
const gy = x => 745 + 5 * Math.sin(x * 0.005 + 1.3) + 3 * Math.sin(x * 0.019);
const farH = x => 548 - 62 * Math.exp(-(((x - 330) / 240) ** 2)) + 16 * Math.sin(x * 0.006 + 1) + 9 * Math.sin(x * 0.017 + 2) + 4 * Math.sin(x * 0.05);
const midH = x => 664 + 12 * Math.sin(x * 0.0042 + 0.5) + 7 * Math.sin(x * 0.013) + 3 * Math.sin(x * 0.04) - 24 * Math.exp(-(((x - 1360) / 260) ** 2));
const PBASE = gy(PX) + 5, PH = PR * 0.82, PCY = PBASE - PH;

// ---------------------------------------------------------------- textures
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function tint(src, col) { const c = mk(src.width, src.height), g = c.getContext('2d'); g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = col; g.fillRect(0, 0, c.width, c.height); return c; }
function puff(g, x, y, rad, sx, a) {
  g.save(); g.translate(x, y); g.scale(sx, 1);
  const gr = g.createRadialGradient(0, 0, 0, 0, 0, rad);
  gr.addColorStop(0, `rgba(255,255,255,${a})`); gr.addColorStop(.55, `rgba(255,255,255,${a * .4})`); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(0, 0, rad, 0, TAU); g.fill(); g.restore();
}
function cloudTex(seed) {
  const w = 1100, h = 240, c = mk(w, h), g = c.getContext('2d'), r = rng(seed);
  for (let i = 0; i < 110; i++) {
    const u = .06 + r() * .88, e = Math.pow(Math.sin(Math.PI * u), .8);
    const rad = (14 + r() * 58) * e + 8;
    puff(g, u * w, h * .66 - r() * .8 * rad * e, rad, 1.5 + r(), .3);
  }
  return c;
}
function fogTex(seed) {
  const w = 1400, h = 300, c = mk(w, h), g = c.getContext('2d'), r = rng(seed);
  for (let i = 0; i < 140; i++) {
    const x = r() * w, y = h * (.42 + r() * .18), rad = 30 + r() * 70, sx = 1.8 + r() * 1.5, a = .12 + r() * .14;
    for (const o of [-w, 0, w]) puff(g, x + o, y, rad, sx, a);
  }
  return c;
}
const clouds = [cloudTex(11), cloudTex(23), cloudTex(37)];
const cloudBody = clouds.map(c => tint(c, '#2c2042')), cloudLit = clouds.map(c => tint(c, '#e4d6f2'));
const fogA = tint(fogTex(5), '#9a86c8'), fogB = tint(fogTex(9), '#b9a6dc');
const grain = (() => {
  const c = mk(256, 256), g = c.getContext('2d'), d = g.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); return c;
})();
let grainPat = null;

// ---------------------------------------------------------------- scene data
const stars = []; { const r = rng(7); for (let i = 0; i < 560; i++) stars.push({ x: -1400 + r() * 4400, y: -900 + r() * 1500, s: Math.pow(r(), 3) * 1.9 + .35, p: r() * TAU, f: .5 + r() * 2.4, c: r() }); }
const craters = []; { const r = rng(3); for (let i = 0; i < 22; i++) { const a = r() * TAU, d = Math.sqrt(r()) * MR * .85; craters.push({ x: Math.cos(a) * d, y: Math.sin(a) * d, r: 3 + Math.pow(r(), 2) * 16 }); } }
const maria = [[-30, -20, 34], [18, 22, 26], [-8, 40, 18], [36, -30, 20], [-46, 22, 16]];

function genTree(seed, x, y, ang, len, w, maxD, o) {
  const r = rng(seed), segs = [];
  (function br(x, y, a, len, w, d) {
    let cx = x, cy = y;
    for (let k = 0; k < 3; k++) {
      a += (r() - .5) * o.gnarl;
      a = a * (1 - o.up) - Math.PI / 2 * o.up;
      const nx = cx + Math.cos(a) * len / 3, ny = cy + Math.sin(a) * len / 3;
      segs.push({ x1: cx, y1: cy, x2: nx, y2: ny, w: w * (1 - k * .11 - .05), d1: d + k / 3, d2: d + (k + 1) / 3 });
      cx = nx; cy = ny;
    }
    if (d < maxD) {
      const nb = d < 1 ? 2 : (r() < .55 ? 2 : 3);
      for (let i = 0; i < nb; i++) {
        const sp = (i - (nb - 1) / 2) * (.5 + r() * .4) + (r() - .5) * .3 + o.lean;
        br(cx, cy, a + sp, len * (.64 + r() * .16), w * .63, d + 1);
      }
    }
  })(x, y, ang, len, w, 0);
  return segs;
}
const bigTree = genTree(4, 92, gy(92) + 8, -1.42, 230, 40, 6, { gnarl: .62, up: .02, lean: .16 });
const smallTrees = [[598, 3, .55], [790, 8, .4], [1585, 12, .6], [40, 15, .45], [1760, 21, .5], [-160, 26, .5]].map(([x, s, sc]) =>
  genTree(s, x, midH(x) + 4, -1.57 + (rng(s)() - .5) * .3, 90 * sc / .5, 9 * sc / .5, 4, { gnarl: .7, up: .05, lean: 0 }));
const spiderAnchor = (() => { let best = null; for (const s of bigTree) if (s.d2 > 3.4 && s.x2 > 260 && s.x2 < 380 && s.y2 > 160 && (!best || s.y2 > best.y2)) best = s; return best || bigTree[bigTree.length - 1]; })();

const grassEdge = []; { const r = rng(17); for (let x = -1000; x < 2600; x += 5 + r() * 4) grassEdge.push({ x, h: 6 + r() * 16, l: (r() - .5) * 6, p: r() * TAU }); }
const grassFront = []; { const r = rng(19); for (let x = -1000; x < 2600; x += 6 + r() * 6) grassFront.push({ x, h: 18 + r() * 46, l: (r() - .5) * 14, p: r() * TAU }); }

const pumpkins = [
  { x: 300, r: 27, face: 'zig', ph: 4.2, dy: 26 },
  { x: 470, r: 35, face: 'tri', ph: .3, dy: 22 },
  { x: 590, r: 22, face: null, ph: 0, dy: 30 },
  { x: 1050, r: 40, face: 'round', ph: 1.7, dy: 20 },
  { x: 1388, r: 30, face: 'o', ph: 2.9, dy: 24 },
  { x: 1545, r: 23, face: null, ph: 0, dy: 34 },
  { x: 120, r: 31, face: 'tri', ph: 5.1, dy: 40 },
];
const tombs = [
  { x: 1088, w: 46, h: 70, type: 'round', lean: -.08 },
  { x: TOMB_X, w: 66, h: 98, type: 'rip', lean: .03 },
  { x: 1305, w: 42, h: 86, type: 'cross', lean: .07 },
  { x: 1458, w: 58, h: 80, type: 'gothic', lean: -.04 },
];
// crab cells (12x8 grid, cols -2..9) used for the carved pumpkin face
const CRAB_CELLS = (() => {
  const c = [], r = rng(99);
  for (let y = 0; y < 6; y++) for (let x = 0; x < 8; x++) if (!(y === 1 && (x === 1 || x === 6))) c.push([x, y]);
  for (let y = 2; y < 4; y++) c.push([-2, y], [-1, y], [8, y], [9, y]);
  for (const x of [0, 2, 5, 7]) for (let y = 6; y < 8; y++) c.push([x, y]);
  return c.map(p => ({ p, k: p[0] + p[1] * .45 + r() * 1.4 })).sort((a, b) => a.k - b.k).map(o => o.p);
})();

// ---------------------------------------------------------------- particles
const P = [];
function spawn(o) { P.push(Object.assign({ age: 0, life: 1, vx: 0, vy: 0, g: 0, rot: 0, vr: 0, s: 1 }, o)); }
function updateParticles(dt) {
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i]; p.age += dt;
    if (p.age >= p.life) { P.splice(i, 1); continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.drag) { p.vx *= Math.exp(-p.drag * dt); p.vy *= Math.exp(-p.drag * dt); }
    if (p.bounce && p.y > gy(p.x) + p.bounce) { p.y = gy(p.x) + p.bounce; p.vy *= -.28; p.vx *= .55; p.vr *= .5; }
  }
}
const CANDY = ['#ff4f7b', '#7cf0a4', '#ffd23f', '#9d7bff', '#4fd2ff', '#ff8a2a'];

// ---------------------------------------------------------------- shapes
function star4(x, y, r, a) {
  ctx.beginPath();
  for (let i = 0; i < 8; i++) { const rr = i % 2 ? r * .22 : r, an = a + i * Math.PI / 4; ctx.lineTo(x + Math.cos(an) * rr, y + Math.sin(an) * rr); }
  ctx.closePath();
}
function drawCandyCorn(s) {
  ctx.save(); ctx.beginPath(); ctx.moveTo(0, -9 * s); ctx.quadraticCurveTo(6 * s, 2 * s, 7 * s, 8 * s); ctx.quadraticCurveTo(0, 10 * s, -7 * s, 8 * s); ctx.quadraticCurveTo(-6 * s, 2 * s, 0, -9 * s); ctx.clip();
  ctx.fillStyle = '#ffc531'; ctx.fillRect(-8 * s, 3 * s, 16 * s, 8 * s);
  ctx.fillStyle = '#ff7b1c'; ctx.fillRect(-8 * s, -3 * s, 16 * s, 6.2 * s);
  ctx.fillStyle = '#fff6e4'; ctx.fillRect(-8 * s, -10 * s, 16 * s, 7.2 * s);
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(-2.5 * s, -6 * s, 1.6 * s, 11 * s);
  ctx.restore();
}
function drawWrapped(s, col) {
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(-6 * s, 0); ctx.lineTo(-12 * s, -5 * s); ctx.lineTo(-11 * s, 0); ctx.lineTo(-12 * s, 5 * s); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(6 * s, 0); ctx.lineTo(12 * s, -5 * s); ctx.lineTo(11 * s, 0); ctx.lineTo(12 * s, 5 * s); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, 0, 7.5 * s, 5.5 * s, 0, 0, TAU); ctx.fill();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 1.6 * s;
  for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i * 4 * s - 4 * s, -7 * s); ctx.lineTo(i * 4 * s + 4 * s, 7 * s); ctx.stroke(); }
  ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fillRect(-8 * s, 1.5 * s, 16 * s, 5 * s);
  ctx.restore();
}
function pixelHeart(x, y, s, col) {
  const m = ['0110110', '1111111', '1111111', '0111110', '0011100', '0001000'];
  ctx.fillStyle = col;
  ctx.beginPath();
  m.forEach((row, j) => [...row].forEach((c, i) => { if (c === '1') ctx.rect(x + (i - 3.5) * s - .2, y + (j - 3) * s - .2, s + .4, s + .4); }));
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillRect(x - 2.5 * s, y - 2 * s, s, s);
}
function drawBat(x, y, s, flap, alpha = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.globalAlpha *= alpha;
  ctx.fillStyle = '#0a0612';
  const wy = flap * 13;
  for (const sg of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(sg * 3, -3);
    ctx.quadraticCurveTo(sg * 14, -11 + wy * .4, sg * 30, -5 + wy);
    ctx.quadraticCurveTo(sg * 26, -1 + wy * .7, sg * 23, 3 + wy * .55);
    ctx.quadraticCurveTo(sg * 19, -1 + wy * .4, sg * 15, 5 + wy * .3);
    ctx.quadraticCurveTo(sg * 11, 1 + wy * .15, sg * 7, 6);
    ctx.lineTo(sg * 3, 4); ctx.closePath(); ctx.fill();
  }
  ctx.beginPath(); ctx.ellipse(0, 1, 4.5, 7, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-4, -4); ctx.lineTo(-3.5, -10); ctx.lineTo(-1, -5); ctx.lineTo(1, -5); ctx.lineTo(3.5, -10); ctx.lineTo(4, -4); ctx.fill();
  ctx.fillStyle = '#ff5a3a'; ctx.fillRect(-2.4, -3, 1.4, 1.2); ctx.fillRect(1, -3, 1.4, 1.2);
  ctx.restore();
}
function glow(x, y, r, rgb, a, sy = 1) {
  if (a <= .002) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.translate(x, y); ctx.scale(1, sy);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
  g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(.3, `rgba(${rgb},${a * .45})`); g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g; ctx.fillRect(-r, -r, 2 * r, 2 * r); ctx.restore();
}

// ---------------------------------------------------------------- sky
function drawSky(t) {
  const g = ctx.createLinearGradient(0, Ty, 0, 640);
  g.addColorStop(0, '#04020b'); g.addColorStop(.3, '#0e0826'); g.addColorStop(.58, '#22113f');
  g.addColorStop(.78, '#3f1a4c'); g.addColorStop(.9, '#6b2747'); g.addColorStop(1, '#93402f');
  ctx.fillStyle = g; ctx.fillRect(Lx - 5, Ty - 5, Rx - Lx + 10, By - Ty + 10);
  // stars
  for (const s of stars) {
    if (s.x < Lx || s.x > Rx || s.y < Ty || s.y > 560) continue;
    const dm = Math.hypot(s.x - MX, s.y - MY); if (dm < MR * 1.5) continue;
    const fade = clamp((560 - s.y) / 260) * clamp((dm - MR * 1.5) / 200);
    const a = (.5 + .5 * Math.sin(t * s.f + s.p)) * fade * (s.s > 1.2 ? 1 : .8);
    if (a < .03) continue;
    ctx.fillStyle = s.c < .15 ? `rgba(255,214,170,${a})` : s.c > .85 ? `rgba(190,210,255,${a})` : `rgba(255,250,240,${a})`;
    ctx.fillRect(s.x - s.s / 2, s.y - s.s / 2, s.s, s.s);
    if (s.s > 1.7) { ctx.globalAlpha = a * .5; ctx.fillRect(s.x - s.s * 3, s.y - .4, s.s * 6, .8); ctx.fillRect(s.x - .4, s.y - s.s * 3, .8, s.s * 6); ctx.globalAlpha = 1; }
  }
  // shooting stars
  for (const [t0, x0, y0] of [[3.4, 520, 40], [19.6, 900, -10], [11.5, 200, 90]]) {
    const u = seg(t % LOOP, t0, t0 + .9); if (u <= 0 || u >= 1) continue;
    const hx = x0 + u * 420, hy = y0 + u * 170, a = Math.sin(Math.PI * u);
    const gr = ctx.createLinearGradient(hx, hy, hx - 160, hy - 65);
    gr.addColorStop(0, `rgba(255,245,225,${a})`); gr.addColorStop(1, 'rgba(255,245,225,0)');
    ctx.strokeStyle = gr; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx - 160, hy - 65); ctx.stroke();
    glow(hx, hy, 14, '255,240,220', .6 * a);
  }
  // horizon haze
  const hz = ctx.createLinearGradient(0, 400, 0, 600);
  hz.addColorStop(0, 'rgba(255,120,70,0)'); hz.addColorStop(1, 'rgba(255,110,60,.16)');
  ctx.fillStyle = hz; ctx.fillRect(Lx, 400, Rx - Lx, 200);
}
function drawMoon(t) {
  glow(MX, MY, MR * 5.2, '255,226,186', .2);
  glow(MX, MY, MR * 2.1, '255,236,206', .25);
  ctx.save();
  ctx.beginPath(); ctx.arc(MX, MY, MR, 0, TAU);
  const g = ctx.createRadialGradient(MX - 34, MY - 36, 8, MX, MY, MR);
  g.addColorStop(0, '#fffcef'); g.addColorStop(.62, '#f6e7c3'); g.addColorStop(1, '#dcc290');
  ctx.fillStyle = g; ctx.fill(); ctx.clip();
  for (const [x, y, r] of maria) { ctx.fillStyle = 'rgba(190,160,120,.22)'; ctx.beginPath(); ctx.ellipse(MX + x, MY + y, r * 1.3, r, .4, 0, TAU); ctx.fill(); }
  for (const c of craters) {
    ctx.fillStyle = 'rgba(160,128,92,.28)'; ctx.beginPath(); ctx.arc(MX + c.x, MY + c.y, c.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,250,235,.4)'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(MX + c.x + .8, MY + c.y + .8, c.r, Math.PI * .1, Math.PI * .9); ctx.stroke();
  }
  // limb darkening
  const lg = ctx.createRadialGradient(MX, MY, MR * .7, MX, MY, MR);
  lg.addColorStop(0, 'rgba(120,70,40,0)'); lg.addColorStop(1, 'rgba(150,90,50,.28)');
  ctx.fillStyle = lg; ctx.fillRect(MX - MR, MY - MR, MR * 2, MR * 2);
  ctx.restore();
}
function drawClouds(t) {
  const span = (Rx - Lx) + 2400;
  const defs = [[0, 150, 7, .85, 0], [1, 300, 4.5, .75, 900], [2, 70, 9, .6, 1700], [1, 395, 3, .55, 2300]];
  for (const [i, y, sp, sc, off] of defs) {
    const w = 1100 * sc, h = 240 * sc;
    const x = Lx - 1200 + (((off + t * sp) % span) + span) % span;
    const near = clamp(1 - Math.hypot(x + w / 2 - MX, y + h * .6 - MY) / 650);
    ctx.globalAlpha = .35 + .55 * near; ctx.drawImage(cloudLit[i], x, y - 7 * sc, w, h);
    ctx.globalAlpha = .82; ctx.drawImage(cloudBody[i], x, y, w, h);
  }
  ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------- landscape
function ridge(f, fill, rim) {
  ctx.beginPath(); ctx.moveTo(Lx - 10, By + 10);
  for (let x = Lx - 10; x <= Rx + 10; x += 6) ctx.lineTo(x, f(x));
  ctx.lineTo(Rx + 10, By + 10); ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
  if (rim) {
    ctx.beginPath(); for (let x = Lx - 10; x <= Rx + 10; x += 6) ctx.lineTo(x, f(x) + 1);
    ctx.strokeStyle = rim; ctx.lineWidth = 1.6; ctx.stroke();
  }
}
const houseWins = [[-52, -74, 16, 22, 1], [-14, -74, 16, 22, 2], [24, -74, 16, 22, 3], [-52, -36, 16, 22, 4], [24, -36, 16, 22, 5], [-98, -120, 12, 20, 6], [-98, -80, 12, 20, 7], [92, -42, 14, 18, 8], [118, -42, 14, 18, 9]];
function drawHouse(t) {
  const hx = 330, hy = farH(330) + 8;
  ctx.save(); ctx.translate(hx, hy); ctx.scale(.92, .92);
  const C = '#120820';
  ctx.fillStyle = C; ctx.beginPath();
  ctx.rect(-70, -92, 140, 96);
  ctx.moveTo(-86, -90); ctx.lineTo(-4, -158); ctx.lineTo(82, -90); ctx.closePath();

  pixelBubble(G.head.x - 30, G.head.y - 46, 'Happy Halloween!', backO(seg(T, 27.4, 27.65)) * (1 - seg(T, 29.2, 29.3)), true);
  // post: vignette + grain
  const vg = ctx.createRadialGradient(800, 470, 300, 800, 470, Math.max(Rx - Lx, By - Ty) * .75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(2,0,8,.62)');
  ctx.fillStyle = vg; ctx.fillRect(Lx, Ty, Rx - Lx, By - Ty);
  // iris
  let ir = null;
  if (T < 1.1) ir = { x: 800, y: 560, r: eio(seg(T, 0, 1.1)) * 1500 };
  else if (T > 28.4) ir = { x: G.head.x, y: G.head.y + 10, r: (1 - eio(seg(T, 28.4, 29.5))) * 1500 };
  if (ir && ir.r < 1500) {
    ctx.beginPath(); ctx.rect(Lx - 10, Ty - 10, Rx - Lx + 20, By - Ty + 20); ctx.arc(ir.x, ir.y, Math.max(.01, ir.r), 0, TAU, true);
    ctx.fillStyle = '#05030b'; ctx.fill('evenodd');
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (!grainPat) grainPat = ctx.createPattern(grain, 'repeat');
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .07;
  ctx.translate(Math.random() * 256 | 0, Math.random() * 256 | 0);
  ctx.fillStyle = grainPat; ctx.fillRect(-256, -256, cv.width + 256, cv.height + 256);
  ctx.restore();
}

let simT = 0, last = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000 || 0); last = now; simT += dt;
  const T = simT % LOOP;
  if (T < lastT) { P.length = 0; toss = null; G.broomTail = null; }
  events(T, dt);
  updateParticles(dt);
  render(T, simT);
  lastT = T;
  requestAnimationFrame(frame);
}
Promise.race([
  Promise.all([document.fonts.load('112px Creepster'), document.fonts.load('15px "Press Start 2P"')]),
  new Promise(r => setTimeout(r, 3000)),
]).then(() => requestAnimationFrame(n => { last = n; frame(n); }));
</script>
